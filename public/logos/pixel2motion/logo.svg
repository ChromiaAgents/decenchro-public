<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Decenchro logo</title>
  <desc id="desc">A minimal teal geometric memory mark with the Decenchro wordmark.</desc>
  <defs>
    <style>
      :root {
        --decenchro-bg: #faf8f5;
        --decenchro-teal: #0e7569;
        --decenchro-text: #2f2c27;
      }
      text {
        font-family: Outfit, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        letter-spacing: -0.018em;
      }
    </style>
  </defs>
  <rect id="background" width="1000" height="260" fill="#faf8f5"/>
  <g id="logo-lockup">
    <g id="mark" fill="none" stroke="#0e7569" stroke-linejoin="round">
      <path id="ledger-tile" d="M68 86 Q68 76 78 74 L166 58 Q178 56 178 68 L178 106 Q178 113 173 118 L136 151 Q130 156 123 157 L78 165 Q68 167 68 156 Z" fill="#0e7569" stroke="none"/>
      <path id="connector" d="M178 104 L134 142 Q128 147 128 155 L128 182" stroke-width="12" stroke-linecap="round" pathLength="1"/>
      <rect id="memory-square" x="128" y="120" width="78" height="78" rx="10" stroke-width="10"/>
    </g>
    <text id="wordmark" x="252" y="171" font-size="92" fill="#2f2c27">Decenchro</text>
  </g>
</svg>
