# Decenchro skin for the Hermes CLI/TUI (the Chat tab in the console runs the
# TUI). Seeded by cont-init into $HERMES_HOME/skins/decenchro.yaml on every
# boot and selected by display.skin in config.yaml.tmpl. Schema:
# hermes_cli/skin_engine.py (SkinConfig); missing keys inherit from `default`.
# Same material as the web theme: teal signal, warm neutrals, no gold.
name: decenchro
description: Decenchro — teal on warm neutrals

colors:
  banner_border: "#0e7569"
  banner_title: "#2aa593"
  banner_accent: "#2aa593"
  banner_dim: "#7a9a94"
  banner_text: "#f0ede6"
  ui_accent: "#2aa593"
  ui_label: "#8fd1c6"
  ui_ok: "#2aa593"
  ui_error: "#e5533d"
  ui_warn: "#e0a33a"
  prompt: "#f0ede6"
  input_rule: "#0e7569"
  response_border: "#0e7569"
  session_label: "#8fd1c6"
  session_border: "#5f6e6b"
  status_bar_bg: "#111a19"
  status_bar_text: "#c9c5bb"
  status_bar_strong: "#2aa593"
  status_bar_dim: "#5f6e6b"
  status_bar_good: "#2aa593"
  status_bar_warn: "#e0a33a"
  status_bar_bad: "#e5533d"
  status_bar_critical: "#ff6b6b"
  completion_menu_bg: "#111a19"
  completion_menu_current_bg: "#1c3330"
  selection_bg: "#1c3330"
  voice_status_bg: "#111a19"

light_colors:
  banner_title: "#0e7569"
  banner_accent: "#0e7569"
  banner_dim: "#726f66"
  banner_text: "#131311"
  ui_accent: "#0e7569"
  ui_label: "#0e7569"
  ui_ok: "#0e7569"
  ui_error: "#b42318"
  ui_warn: "#b7791f"
  prompt: "#131311"
  response_border: "#0e7569"
  session_label: "#0e7569"
  status_bar_text: "#4b4a45"
  status_bar_strong: "#0e7569"
  status_bar_dim: "#726f66"

spinner:
  waiting_faces: ["(◆)", "(◇)", "(◈)"]
  thinking_faces: ["(◆)", "(◇)", "(◈)"]
  thinking_verbs: ["checking the record", "verifying", "signing", "reasoning", "planning"]
  wings:
    - ["⟨◆", "◆⟩"]
    - ["⟨◇", "◇⟩"]

branding:
  agent_name: "Decenchro"
  welcome: "Decenchro agent ready. Type your message or /help for commands."
  goodbye: "Nothing off the record. Goodbye."
  response_label: " ◆ Decenchro "
  prompt_symbol: "❯"
  help_header: "◆ Available Commands"

tool_prefix: "┊"

